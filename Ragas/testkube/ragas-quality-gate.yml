kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: ragas-quality-gate
  namespace: testkube
spec:
  content:
    git:
      uri: https://github.com/sarvaniswapnapriya/rag-eval-ragas.git
      revision: main
  container:
    workingDir: /data/repo
    image: python:3.12-slim
    env:
    - name: GOOGLE_API_KEY
      valueFrom:
        secretKeyRef:
          name: gemini-secrets
          key: api-key
    - name: RAGAS_DO_NOT_TRACK
      value: "true"
  steps:
  - name: ragas-evaluation
    shell: |-
      set -euxo pipefail

      echo "=== Python Environment ==="
      python3 --version

      apt-get update
      apt-get install -y --no-install-recommends curl

      python3 -m pip install --upgrade pip
      python3 -m pip install --no-cache-dir -r requirements.txt

      mkdir -p results

      pytest tests/test_rag.py -v -s

      echo "Finished RAGAS evaluation"
  - name: export-metrics
    condition: always
    container:
      image: docker.io/kubeshop/testkube-ai-metrics-parser:latest
      imagePullPolicy: Always
    shell: |
      testkube-ai-metrics-parser ragas \
        -i results/ragas_results.json \
        -o results/metrics.lp \
        --tag suite=ragas-quality-gate \
        --stdout
  - name: save-results
    condition: always
    artifacts:
      paths:
      - results/**
status:
  health:
    passRate: 0
    flipRate: 0
    overallHealth: 0

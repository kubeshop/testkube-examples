test_cases:
  - id: "qa_001"
    query: "What is your refund policy?"
    expected_answer: "We offer a 30-day full refund on any purchase, no questions asked."
    retrieval_context:
      - "Refund Policy: All customers are eligible for a 30-day full refund on any purchase. Returns must be initiated within 30 days of the original purchase date."
    category: "policy"

  - id: "qa_002"
    query: "How long do I have to return an item?"
    expected_answer: "You have 30 days from the purchase date to initiate a return for a full refund."
    retrieval_context:
      - "Refund Policy: All customers are eligible for a 30-day full refund on any purchase. Returns must be initiated within 30 days of the original purchase date."
    category: "policy"

  - id: "qa_003"
    query: "Is the refund full or partial?"
    expected_answer: "The refund is full - you get 100% of your purchase price back."
    retrieval_context:
      - "Refund Policy: All customers are eligible for a 30-day full refund on any purchase."
    category: "policy"

  - id: "qa_004"
    query: "How long does standard shipping take?"
    expected_answer: "Standard shipping takes 5-7 business days to deliver."
    retrieval_context:
      - "Shipping: Standard shipping takes 5-7 business days. Express shipping takes 2-3 business days. Overnight options are available in most regions."
    category: "shipping"

  - id: "qa_005"
    query: "What's the fastest shipping option?"
    expected_answer: "Overnight shipping is the fastest option available in most regions."
    retrieval_context:
      - "Shipping: Standard shipping takes 5-7 business days. Express shipping takes 2-3 business days. Overnight options are available in most regions."
    category: "shipping"

  - id: "qa_006"
    query: "How long is express shipping?"
    expected_answer: "Express shipping takes 2-3 business days."
    retrieval_context:
      - "Shipping: Standard shipping takes 5-7 business days. Express shipping takes 2-3 business days. Overnight options are available in most regions."
    category: "shipping"

  - id: "qa_007"
    query: "Is overnight shipping available everywhere?"
    expected_answer: "Overnight shipping is available in most regions, but not all areas."
    retrieval_context:
      - "Shipping: Standard shipping takes 5-7 business days. Express shipping takes 2-3 business days. Overnight options are available in most regions."
    category: "shipping"

  - id: "qa_008"
    query: "What payment methods do you accept?"
    expected_answer: "We accept Visa, MasterCard, American Express, PayPal, Apple Pay, and Google Pay."
    retrieval_context:
      - "Payment Methods: We accept Visa, MasterCard, American Express, PayPal, Apple Pay, and Google Pay."
    category: "payment"

  - id: "qa_009"
    query: "Can I pay with PayPal?"
    expected_answer: "Yes, PayPal is an accepted payment method."
    retrieval_context:
      - "Payment Methods: We accept Visa, MasterCard, American Express, PayPal, Apple Pay, and Google Pay."
    category: "payment"

  - id: "qa_010"
    query: "Do you accept digital wallets?"
    expected_answer: "Yes, we accept both Apple Pay and Google Pay as digital wallet options."
    retrieval_context:
      - "Payment Methods: We accept Visa, MasterCard, American Express, PayPal, Apple Pay, and Google Pay."
    category: "payment"

  - id: "qa_011"
    query: "How do I track my order?"
    expected_answer: "You can track your order in your Account Dashboard under Order History."
    retrieval_context:
      - "Order Tracking: Orders can be tracked in Account Dashboard under Order History. Customers receive automatic email updates when orders ship and arrive."
    category: "orders"

  - id: "qa_012"
    query: "Will I be notified when my order ships?"
    expected_answer: "Yes, you will receive automatic email updates when your order ships and arrives."
    retrieval_context:
      - "Order Tracking: Orders can be tracked in Account Dashboard under Order History. Customers receive automatic email updates when orders ship and arrive."
    category: "orders"

  - id: "qa_013"
    query: "How do I reset my password?"
    expected_answer: "Click 'Forgot Password' on the login page and follow the instructions sent to your email."
    retrieval_context:
      - "Password Reset: Click 'Forgot Password' on the login page. Reset links are sent to your registered email and expire after 24 hours."
    category: "account"

  - id: "qa_014"
    query: "How long is a password reset link valid?"
    expected_answer: "Password reset links expire after 24 hours."
    retrieval_context:
      - "Password Reset: Click 'Forgot Password' on the login page. Reset links are sent to your registered email and expire after 24 hours."
    category: "account"

  - id: "qa_015"
    query: "Do you offer discounts for bulk orders?"
    expected_answer: "Yes, discounts are available for orders exceeding 50 units."
    retrieval_context:
      - "Bulk Orders: Discounts are available for purchases exceeding 50 units. Contact sales@company.com for enterprise pricing."
    category: "bulk"

  - id: "qa_016"
    query: "What is the minimum quantity for bulk discounts?"
    expected_answer: "You need to purchase more than 50 units to qualify for bulk discounts."
    retrieval_context:
      - "Bulk Orders: Discounts are available for purchases exceeding 50 units. Contact sales@company.com for enterprise pricing."
    category: "bulk"

  - id: "qa_017"
    query: "How do I get pricing for a large order?"
    expected_answer: "Contact sales@company.com to request enterprise pricing for bulk orders."
    retrieval_context:
      - "Bulk Orders: Discounts are available for purchases exceeding 50 units. Contact sales@company.com for enterprise pricing."
    category: "bulk"

  - id: "qa_018"
    query: "What shipping and refund options do I have?"
    expected_answer: "We offer multiple shipping options including standard (5-7 days), express (2-3 days), and overnight shipping. All purchases come with a 30-day full refund guarantee."
    retrieval_context:
      - "Refund Policy: All customers are eligible for a 30-day full refund on any purchase. Returns must be initiated within 30 days of the original purchase date."
      - "Shipping: Standard shipping takes 5-7 business days. Express shipping takes 2-3 business days. Overnight options are available in most regions."
    category: "mixed"

  - id: "qa_019"
    query: "Can I use Apple Pay and get a refund?"
    expected_answer: "Yes, Apple Pay is an accepted payment method and all purchases are eligible for a 30-day full refund."
    retrieval_context:
      - "Payment Methods: We accept Visa, MasterCard, American Express, PayPal, Apple Pay, and Google Pay."
      - "Refund Policy: All customers are eligible for a 30-day full refund on any purchase."
    category: "mixed"

  - id: "qa_020"
    query: "What is your complete customer support policy?"
    expected_answer: "We offer 30-day full refunds, multiple shipping options (standard 5-7 days, express 2-3 days, overnight), various payment methods (Visa, MasterCard, Amex, PayPal, Apple Pay, Google Pay), order tracking via Account Dashboard with email notifications, password reset via email (24 hour links), and bulk discounts for 50+ unit purchases through sales@company.com."
    retrieval_context:
      - "Refund Policy: All customers are eligible for a 30-day full refund on any purchase. Returns must be initiated within 30 days of the original purchase date."
      - "Shipping: Standard shipping takes 5-7 business days. Express shipping takes 2-3 business days. Overnight options are available in most regions."
      - "Payment Methods: We accept Visa, MasterCard, American Express, PayPal, Apple Pay, and Google Pay."
      - "Order Tracking: Orders can be tracked in Account Dashboard under Order History. Customers receive automatic email updates when orders ship and arrive."
      - "Password Reset: Click 'Forgot Password' on the login page. Reset links are sent to your registered email and expire after 24 hours."
      - "Bulk Orders: Discounts are available for purchases exceeding 50 units. Contact sales@company.com for enterprise pricing."
    category: "mixed"
